services:
  ccna-site:
    build:
      context: .
    container_name: ccna-site
    ports:
      - "8080:80"
    restart: unless-stopped

  ccna-site-dev:
    image: python:3.12-slim
    container_name: ccna-site-dev
    working_dir: /app
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
             python scripts/sync_docs.py &&
             mkdocs serve --dev-addr 0.0.0.0:8000"
    profiles:
      - dev
