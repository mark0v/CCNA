site_name: Learning Materials
site_description: Учебная библиотека по CCNA, английскому, Quality Assurance, Kubernetes и будущим направлениям
site_author: Learning Materials
docs_dir: docs
site_dir: site
not_in_nav: |
  index.md
  ccna/articles/index.md
  quality-assurance/overview/00-overview-1.md

theme:
  name: material
  language: ru
  features:
    - navigation.instant
    - navigation.indexes
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-night
        name: Темная тема
    - scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Светлая тема

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite

plugins:
  - search:
      lang:
        - en
        - ru

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/nav-folder-toggle-v2.js

