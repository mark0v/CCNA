site_name: Learning Materials
site_description: Учебная библиотека по CCNA, английскому и будущим направлениям
site_author: Learning Materials
docs_dir: docs
site_dir: site

theme:
  name: material
  language: ru
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-night
        name: Темная тема
    - scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Светлая тема

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite

plugins:
  - search:
      lang:
        - en
        - ru

nav:
  - Главная: index.md
  - CCNA:
      - Обзор: ccna/articles/index.md
      - План обучения: ccna/study-plan.md
      - Week 01:
          - Обзор недели: ccna/articles/2026-05/week-01/index.md
          - 01 - What is a Network?: ccna/articles/2026-05/week-01/01-what-is-a-network.md
          - 02 - What is a Switch?: ccna/articles/2026-05/week-01/02-what-is-a-switch.md
          - 03 - What is a Router?: ccna/articles/2026-05/week-01/03-what-is-a-router.md
          - 04 - What is TCP/IP and OSI?: ccna/articles/2026-05/week-01/04-what-is-tcp-ip-and-osi.md
          - 05 - REAL LIFE Example: ccna/articles/2026-05/week-01/05-real-life-example-tcp-ip-and-osi-layers.md
          - 06 - The YouTube OSI Model Story: ccna/articles/2026-05/week-01/06-the-youtube-osi-model-story.md
          - 07 - Network Design Warning: ccna/articles/2026-05/week-01/07-do-not-design-your-network-like-this.md
          - 08 - Data Center Networks: ccna/articles/2026-05/week-01/08-data-center-networks-what-do-they-look-like.md
          - 09 - WAN Is Not Always Internet: ccna/articles/2026-05/week-01/09-wan-its-not-the-internet-sometimes.md
          - 10 - Home Network Security: ccna/articles/2026-05/week-01/10-lets-hack-your-home-network.md
          - 11 - Hybrid Cloud: ccna/articles/2026-05/week-01/11-you-need-to-learn-hybrid-cloud-right-now.md
